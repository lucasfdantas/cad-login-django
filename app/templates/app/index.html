<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Principal</title>
    <!-- Importando o CSS do Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Container flexível para centralizar o conteúdo verticalmente e horizontalmente -->
    <div class="container d-flex justify-content-center align-items-center vh-100">
        
        <div class="card shadow-lg p-5 text-center" style="width: 100%; max-width: 400px; border-radius: 15px;">
            <!-- Seu Título -->
            <h1 class="mb-4 fw-bold text-primary">PÁGINA PRINCIPAL</h1>
            
            <!-- Grupo de botões com espaçamento -->
            <div class="d-grid gap-3">
                <a href="{% url 'cadastro'%}" class="btn btn-success btn-lg">Cadastro</a>
                <a href="{% url 'login'%}" class="btn btn-primary btn-lg">Login</a>
                <a href="{% url 'painel'%}" class="btn btn-dark btn-lg">Painel</a>
            </div>
        </div>

    </div>

    <!-- Importando o JS do Bootstrap 5 (Opcional para esta página, mas recomendado) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
