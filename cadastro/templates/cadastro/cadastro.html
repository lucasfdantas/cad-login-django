<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <!-- Importando o CSS do Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Container flexível: Usei min-vh-100 para garantir que caiba em telas menores sem cortar -->
    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
        
        <div class="card shadow-lg p-4 p-md-5" style="width: 100%; max-width: 500px; border-radius: 15px;">
            <h2 class="mb-4 text-center fw-bold text-primary">Criar Conta</h2>

            <!-- Bloco de Mensagens transformado em Alertas do Bootstrap -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'cadastro' %}">
                {% csrf_token %}
                
                <!-- Campo: Usuário -->
                <div class="mb-3">
                    <label for="id_usuario" class="form-label text-muted fw-semibold">Usuário:</label>
                    <input type="text" name="usuario" id="id_usuario" class="form-control" placeholder="Digite seu usuário" required>
                </div>

                <!-- Campo: E-mail -->
                <div class="mb-3">
                    <label for="id_email" class="form-label text-muted fw-semibold">E-mail:</label>
                    <input type="email" name="email" id="id_email" class="form-control" placeholder="Digite seu e-mail" required>
                </div>

                <!-- Campo: Senha -->
                <div class="mb-3">
                    <label for="id_senha" class="form-label text-muted fw-semibold">Senha:</label>
                    <input type="password" name="senha" id="id_senha" class="form-control" placeholder="Crie uma senha" required>
                </div>

                <!-- Campo: Confirmar Senha -->
                <div class="mb-4">
                    <label for="id_confirmar_senha" class="form-label text-muted fw-semibold">Confirmar Senha:</label>
                    <input type="password" name="confirmar_senha" id="id_confirmar_senha" class="form-control" placeholder="Repita a senha" required>
                </div>

                <!-- Botão de Submit -->
                <button type="submit" class="btn btn-success btn-lg w-100">Cadastrar</button>
            </form>

            <!-- Link de Login no rodapé do card -->
            <div class="mt-4 text-center">
                <p class="mb-0 text-muted">Já possui conta? <a href="{% url 'login' %}" class="fw-bold text-decoration-none">Entrar</a></p>
            </div>
        </div>

    </div>

    <!-- Importando o JS do Bootstrap 5 (Necessário para fechar os alertas das mensagens) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
