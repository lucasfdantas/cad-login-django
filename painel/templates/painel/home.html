<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Restrito</title>
    <!-- Importando o CSS do Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Container principal com espaçamento no topo e fundo -->
    <div class="container py-5 min-vh-100">
        
        <!-- Título da Página fora do cartão para dar cara de sistema -->
        <div class="text-center mb-4">
            <h1 class="fw-bold text-primary">PAINEL PRINCIPAL <span class="text-danger">- RESTRITO</span></h1>
        </div>

        <!-- Cartão (Card) mais largo para acomodar a tabela -->
        <div class="card shadow-lg p-4 p-md-5 mx-auto" style="max-width: 900px; border-radius: 15px;">
            
            <!-- Cabeçalho interno do Painel (Flexbox para alinhar texto à esquerda e botão à direita) -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                <div>
                    <h2 class="h4 fw-bold mb-1">Bem-vindo ao Painel!</h2>
                    <p class="text-muted mb-0 fs-5">Olá, <span class="text-primary fw-semibold">{{ request.user.first_name }}</span>!</p>
                </div>
                <form action="{% url 'view_administrador' %}" method="POST" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-danger px-4 fw-bold">ADMINISTRADOR</button>
                </form>
                <!-- Botão de Logout -->
                <form action="{% url 'logout' %}" method="POST" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-danger px-4 fw-bold">Sair da Conta</button>
                </form>
            </div>

            <!-- Linha divisória charmosa -->
            <hr class="mb-4 text-muted">

            <!-- Tabela Estilizada -->
            <h5 class="mb-3 fw-semibold text-secondary">Lista de Usuários</h5>
            
            <div class="table-responsive">
                <table class="table table-hover table-bordered border-light align-middle shadow-sm">
                    <thead class="table-dark text-center">
                        <tr>
                            <th>Nome de Usuário</th>
                            <th>Email</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for usuario in usuarios %}
                        <tr>
                            <td class="px-3">{{ usuario.first_name }}</td>
                            <td class="px-3 text-muted">{{ usuario.email }}</td>
                        </tr>
                        {% empty %}
                        <!-- BÔNUS: Caso não tenha usuários, exibe esta mensagem (funcionalidade nativa do Django) -->
                        <tr>
                            <td colspan="2" class="text-center text-muted py-3">Nenhum usuário encontrado.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

        </div>

    </div>

    <!-- Importando o JS do Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
