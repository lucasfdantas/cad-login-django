<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Quantidade</th>
            </tr>
        </thead>
        <tbody>
            {% for item in carrinho.values %}
            <tr>
                <td>{{ item.nome }}</td>
                <td>{{ item.qtd }}</td>
                </td>
            </tr>
            {% endfor %}
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2"><strong>Total:</strong></td>
                <td><strong>{{ total_carrinho }}</strong></td>
            </tr>

        </tfoot>
    </table>
    <form action="" method="post">
         {% csrf_token %}
    <button type="submit">Fazer pagamento</button>
    </form>
</body>

</html>
